services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opsmind-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port from .env; container Postgres always listens on 5432
      - "${POSTGRES_PORT}:5432"
    volumes:
      - opsmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: opsmind-api
    env_file:
      - .env
    environment:
      # Compose network uses hostname `db` (see DATABASE_URL_*_DOCKER in .env)
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC_DOCKER}
      DATABASE_URL_READONLY: ${DATABASE_URL_READONLY_DOCKER}
      PLAYBOOKS_DIR: /app/data/playbooks
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Empty = same-origin (nginx proxies to api). Override only for split hosts.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: opsmind-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  opsmind_pgdata:

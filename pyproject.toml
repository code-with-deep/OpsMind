[project]
name = "opsmind"
version = "0.1.0"
description = "Self-Correcting Multi-Agent Operations Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "httpx>=0.28.0",
  "pgvector>=0.3.6",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.2.0",
  "PyJWT>=2.9.0",
  "email-validator>=2.0.0",
  "python-multipart>=0.0.9",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "api",
  "api.app",
  "api.app.routes",
  "opsmind",
  "opsmind.auth",
  "opsmind.db",
  "opsmind.domain",
  "opsmind.graph",
  "opsmind.agents",
  "opsmind.tools",
  "opsmind.guardrails",
  "opsmind.memory",
  "opsmind.grounding",
]

[tool.setuptools.package-dir]
api = "apps/api"
"api.app" = "apps/api/app"
"api.app.routes" = "apps/api/app/routes"
opsmind = "packages/opsmind"
"opsmind.auth" = "packages/opsmind/auth"
"opsmind.db" = "packages/opsmind/db"
"opsmind.domain" = "packages/opsmind/domain"
"opsmind.graph" = "packages/opsmind/graph"
"opsmind.agents" = "packages/opsmind/agents"
"opsmind.tools" = "packages/opsmind/tools"
"opsmind.guardrails" = "packages/opsmind/guardrails"
"opsmind.memory" = "packages/opsmind/memory"
"opsmind.grounding" = "packages/opsmind/grounding"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps", "packages"]
testpaths = ["apps/api/tests", "packages/opsmind/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
